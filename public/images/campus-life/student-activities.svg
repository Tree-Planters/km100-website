<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="cl-activities-title">
  <title id="cl-activities-title">Students gathered around organization booths in the campus courtyard</title>
  <defs>
    <linearGradient id="a-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf9f1"/>
      <stop offset="1" stop-color="#f7e8d3"/>
    </linearGradient>
    <linearGradient id="a-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eee2cc"/>
      <stop offset="1" stop-color="#e3d3b6"/>
    </linearGradient>
    <linearGradient id="a-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e9d7"/>
      <stop offset="1" stop-color="#e9dbc4"/>
    </linearGradient>
    <radialGradient id="a-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd7a6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd7a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="a-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

