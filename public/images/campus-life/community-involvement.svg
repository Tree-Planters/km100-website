<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="cl-community-title">
  <title id="cl-community-title">KM100 students handing out supplies at a barangay outreach</title>
  <defs>
    <linearGradient id="c-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4ee"/>
      <stop offset="1" stop-color="#fbf2e1"/>
    </linearGradient>
    <linearGradient id="c-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dcc2"/>
      <stop offset="1" stop-color="#dfcdae"/>
    </linearGradient>
    <radialGradient id="c-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffdca8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffdca8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c-roof">
      <path d="M742 436 L940 344 L1138 436 Z"/>
    </clipPath>
    <filter id="c-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

