<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="cl-training-title">
  <title id="cl-training-title">A student working at an electronics bench inside the KM100 training laboratory</title>
  <defs>
    <linearGradient id="t-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ebdc"/>
      <stop offset="1" stop-color="#ecdfca"/>
    </linearGradient>
    <linearGradient id="t-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3d4bb"/>
      <stop offset="1" stop-color="#d8c6a9"/>
    </linearGradient>
    <linearGradient id="t-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7f1f0"/>
      <stop offset="1" stop-color="#f6eedd"/>
    </linearGradient>
    <linearGradient id="t-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3532"/>
      <stop offset="1" stop-color="#202724"/>
    </linearGradient>
    <linearGradient id="t-beam" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fff8e9" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fff8e9" stop-opacity="0"/>
    </linearGradient>
    <filter id="t-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#t-wall)"/>
  <rect y="600" width="1200" height="300" fill="url(#t-floor)"/>
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#cbb89c" stroke-width="3"/>

  <!-- Wall panels -->
  <g stroke="#e2d2ba" stroke-width="2">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="330" x2="700" y2="330"/>
    <line x1="700" y1="90" x2="700" y2="600"/>
  </g>

  <!-- Window -->
  <g>
    <rect x="820" y="132" width="300" height="258" rx="4" fill="url(#t-sky)"/>
    <path d="M840 372 L860 372 L800 600 L740 600 Z" fill="url(#t-beam)"/>
    <g fill="none" stroke="#3a352f" stroke-width="9">
      <rect x="820" y="132" width="300" height="258" rx="4"/>
      <line x1="970" y1="132" x2="970" y2="390"/>
      <line x1="820" y1="240" x2="1120" y2="240"/>
    </g>
    <circle cx="880" cy="200" r="26" fill="#f7c894" opacity="0.85"/>
    <path d="M820 350 q60 -30 120 0 q70 -26 180 6 v34 H820Z" fill="#c6d4bd" opacity="0.7"/>
  </g>

  <!-- Pegboard with tools -->
  <g>
    <rect x="120" y="150" width="360" height="216" rx="5" fill="#e5d6bf"/>
    <rect x="120" y="150" width="360" height="216" rx="5" fill="none" stroke="#d2bd9f" stroke-width="6"/>
    <g fill="#cdb997">
      <circle cx="160" cy="186" r="2.5"/><circle cx="200" cy="186" r="2.5"/><circle cx="240" cy="186" r="2.5"/><circle cx="280" cy="186" r="2.5"/><circle cx="320" cy="186" r="2.5"/><circle cx="360" cy="186" r="2.5"/><circle cx="400" cy="186" r="2.5"/><circle cx="440" cy="186" r="2.5"/>
      <circle cx="160" cy="230" r="2.5"/><circle cx="240" cy="230" r="2.5"/><circle cx="320" cy="230" r="2.5"/><circle cx="400" cy="230" r="2.5"/><circle cx="440" cy="230" r="2.5"/>
    </g>
    <!-- Wrench -->
    <g fill="#4a423a" transform="rotate(-12 185 262)">
      <rect x="176" y="232" width="14" height="78" rx="7"/>
      <circle cx="183" cy="230" r="15"/>
      <rect x="176" y="216" width="14" height="22" fill="#e5d6bf"/>
    </g>
    <!-- Hammer -->
    <g fill="#4a423a" transform="rotate(8 268 260)">
      <rect x="262" y="228" width="12" height="82" rx="6"/>
      <rect x="238" y="214" width="60" height="22" rx="6"/>
    </g>
    <!-- Pliers -->
    <g stroke="#4a423a" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M356 216 l-18 66"/>
      <path d="M372 216 l14 66"/>
      <path d="M348 300 q-14 20 2 28"/>
      <path d="M396 300 q14 20 -2 28"/>
    </g>
    <!-- Screwdrivers -->
    <g>
      <rect x="424" y="214" width="8" height="62" rx="3" fill="#4a423a"/>
      <rect x="420" y="274" width="16" height="30" rx="6" fill="#f47721"/>
      <rect x="444" y="214" width="8" height="62" rx="3" fill="#4a423a"/>
      <rect x="440" y="274" width="16" height="30" rx="6" fill="#f47721"/>
    </g>
  </g>

  <!-- Shelf with parts boxes -->
  <g>
    <rect x="120" y="398" width="360" height="12" rx="4" fill="#cbb08b"/>
    <rect x="136" y="362" width="62" height="36" rx="3" fill="#d9c3a4"/>
    <rect x="206" y="352" width="54" height="46" rx="3" fill="#c5ab88"/>
    <rect x="270" y="366" width="72" height="32" rx="3" fill="#e0cbae"/>
    <rect x="352" y="356" width="48" height="42" rx="3" fill="#cbb08b"/>
    <rect x="410" y="370" width="56" height="28" rx="3" fill="#dcc8ab"/>
    <rect x="142" y="370" width="50" height="6" rx="3" fill="#f47721" opacity="0.75"/>
  </g>

  <!-- Poster -->
  <g>
    <rect x="552" y="150" width="176" height="120" rx="4" fill="#252525"/>
    <text x="640" y="204" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="2" fill="#f7f2e8">KM100</text>
    <rect x="586" y="218" width="108" height="6" rx="3" fill="#f47721"/>
    <text x="640" y="246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3" fill="#c9c3b7">SKILLS + TRAINING</text>
  </g>

  <!-- Pendant lamp -->
  <g>
    <line x1="660" y1="0" x2="660" y2="88" stroke="#3a352f" stroke-width="4"/>
    <path d="M618 112 h84 l-14 -26 h-56 Z" fill="#3a352f"/>
    <circle cx="660" cy="116" r="9" fill="#ffd7a2"/>
    <ellipse cx="660" cy="120" rx="120" ry="60" fill="#ffd7a2" opacity="0.18"/>
  </g>

  <!-- Seated student (back view, behind the bench) -->
  <g transform="translate(268 380)">
    <rect x="-56" y="146" width="112" height="30" rx="6" fill="#3b3b3b"/>
    <rect x="-46" y="176" width="12" height="64" rx="4" fill="#4a4a4a"/>
    <rect x="34" y="176" width="12" height="64" rx="4" fill="#4a4a4a"/>
    <path d="M-62 96 q62 -30 124 0 l14 96 H-76 Z" fill="#2f3430"/>
    <path d="M-20 100 q20 40 4 88" stroke="#f47721" stroke-width="5" fill="none" opacity="0.9"/>
    <circle cx="0" cy="54" r="36" fill="#3a2a20"/>
    <path d="M-36 52 q-2 -50 36 -50 q38 0 36 50 q-12 -24 -36 -24 q-24 0 -36 24Z" fill="#1e1a17"/>
    <circle cx="0" cy="20" r="14" fill="#1e1a17"/>
  </g>

  <!-- Workbench -->
  <g>
    <rect x="70" y="560" width="1060" height="34" rx="5" fill="#c9a97c"/>
    <rect x="70" y="560" width="1060" height="10" rx="4" fill="#dcbf95"/>
    <rect x="70" y="594" width="1060" height="16" fill="#b08e63"/>
    <rect x="110" y="610" width="20" height="170" fill="#a8875e"/>
    <rect x="1060" y="610" width="20" height="170" fill="#a8875e"/>
    <rect x="560" y="610" width="18" height="150" fill="#b5946a"/>
    <rect x="120" y="760" width="230" height="16" rx="4" fill="#c8a77a"/>
  </g>

  <!-- Monitor with circuit display -->
  <g>
    <rect x="418" y="372" width="304" height="180" rx="10" fill="#2b2b2b"/>
    <rect x="430" y="384" width="280" height="152" rx="5" fill="url(#t-screen)"/>
    <g stroke="#f47721" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M452 500 h46 v-44 h58 v-38"/>
      <path d="M452 462 h30 v-30 h44"/>
      <path d="M620 402 v44 h56 v34 h30"/>
      <path d="M604 486 h34 v34"/>
    </g>
    <g fill="#f7c48d">
      <circle cx="556" cy="418" r="5"/>
      <circle cx="526" cy="462" r="5"/>
      <circle cx="676" cy="480" r="5"/>
      <circle cx="638" cy="520" r="5"/>
    </g>
    <rect x="556" y="496" width="34" height="24" rx="3" fill="#4a4a4a"/>
    <text x="573" y="513" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#e8dfd2">CPU</text>
    <rect x="556" y="552" width="60" height="10" rx="4" fill="#3a3a3a"/>
    <rect x="516" y="562" width="140" height="12" rx="4" fill="#3a3a3a"/>
  </g>

  <!-- Parts on bench -->
  <g>
    <rect x="790" y="524" width="64" height="36" rx="4" fill="#f47721"/>
    <rect x="804" y="514" width="36" height="12" rx="5" fill="#d95f12"/>
    <rect x="802" y="538" width="40" height="6" rx="3" fill="#ffe6d2" opacity="0.8"/>
    <rect x="880" y="540" width="96" height="20" rx="4" fill="#3d3d3d"/>
    <circle cx="900" cy="532" r="6" fill="#c9a97c"/>
    <rect x="912" y="526" width="26" height="14" rx="2" fill="#c9a97c"/>
    <rect x="946" y="530" width="18" height="10" rx="2" fill="#8e9d7d"/>
    <circle cx="170" cy="540" r="16" fill="#c5ab88"/>
    <circle cx="170" cy="540" r="7" fill="#e6d6bd"/>
  </g>

  <!-- Instructor standing with clipboard -->
  <g transform="translate(1005 385) scale(1.5)">
    <ellipse cx="0" cy="250" rx="52" ry="11" fill="#c2ae8b" opacity="0.5"/>
    <rect x="-24" y="160" width="20" height="84" rx="10" fill="#2f3a44"/>
    <rect x="4" y="160" width="20" height="84" rx="10" fill="#2f3a44"/>
    <rect x="-28" y="238" width="26" height="13" rx="6" fill="#1f262c"/>
    <rect x="2" y="238" width="26" height="13" rx="6" fill="#1f262c"/>
    <path d="M-34 96 q34 -16 68 0 l8 78 q-42 14 -84 0Z" fill="#33382f"/>
    <path d="M-20 98 h14 l4 76 h-18 Z" fill="#f47721"/>
    <path d="M14 98 h10 l6 76 h-16 Z" fill="#f47721"/>
    <path d="M-34 102 q-12 36 4 58" stroke="#33382f" stroke-width="17" stroke-linecap="round" fill="none"/>
    <path d="M34 102 q16 30 4 56" stroke="#33382f" stroke-width="17" stroke-linecap="round" fill="none"/>
    <circle cx="-34" cy="158" r="8" fill="#a4693f"/>
    <circle cx="36" cy="158" r="8" fill="#a4693f"/>
    <rect x="18" y="140" width="52" height="66" rx="5" fill="#e8dfcd" transform="rotate(10 44 173)"/>
    <rect x="26" y="152" width="34" height="4" rx="2" fill="#a99c86" transform="rotate(10 44 173)"/>
    <rect x="26" y="164" width="30" height="4" rx="2" fill="#a99c86" transform="rotate(10 44 173)"/>
    <rect x="26" y="176" width="34" height="4" rx="2" fill="#a99c86" transform="rotate(10 44 173)"/>
    <rect x="-9" y="76" width="18" height="20" rx="6" fill="#a4693f"/>
    <circle cx="0" cy="56" r="28" fill="#b97b4e"/>
    <path d="M-28 50 q-2 -38 28 -38 q30 0 28 38 q-16 -16 -28 -16 q-12 0 -28 16Z" fill="#252525"/>
    <circle cx="0" cy="24" r="12" fill="#252525"/>
  </g>

  <!-- Bench shadow -->
  <ellipse cx="600" cy="792" rx="470" ry="26" fill="#c4b092" opacity="0.35"/>

  <rect width="1200" height="900" filter="url(#t-grain)" opacity="0.2"/>
</svg>
